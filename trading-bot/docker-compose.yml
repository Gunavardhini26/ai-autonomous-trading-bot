version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: trading_postgres
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: trading_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/trading_bot
      - REDIS_URL=redis://redis:6379
      - ANGEL_API_KEY=Zh1i8PYW
      - ANGEL_CLIENT_ID=AAAH308879
      - ANGEL_SECRET_KEY=349b824c-c12c-46ad-8aa7-3f0c357c5020
      - ALPHA_VANTAGE_API_KEY=EC1CRBHX7KYEKJ8C
      - NEWS_API_KEY=ba4e883c48c640dd8449b0f9063b9855
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  # React Frontend
  frontend:
    build: ./frontend
    container_name: trading_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Celery Worker (for AI training jobs)
  celery-worker:
    build: ./backend
    container_name: trading_celery
    command: celery -A jobs.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/trading_bot
      - REDIS_URL=redis://redis:6379
      - ANGEL_API_KEY=Zh1i8PYW
      - ANGEL_CLIENT_ID=AAAH308879
      - ANGEL_SECRET_KEY=349b824c-c12c-46ad-8aa7-3f0c357c5020
      - ALPHA_VANTAGE_API_KEY=EC1CRBHX7KYEKJ8C
      - NEWS_API_KEY=ba4e883c48c640dd8449b0f9063b9855
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build: ./backend
    container_name: trading_celery_beat
    command: celery -A jobs.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/trading_bot
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
